packages:
  - tests
  - tests/intended-app
  - packages/console-shared-ts
  - packages/wallet-console-shared-ts
  - packages/wallet-console-server-ts
  - packages/console-server-ts
  - packages/grain-field-ts
  - packages/site-navbar-ts
  - apps/wallet-console
nodeLinker: hoisted
saveExact: true
verifyDepsBeforeRun: false
allowBuilds:
  bufferutil: true
  esbuild: true
  protobufjs: false
  sharp: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - '@seams/host@0.77.0'
  - '@seams/mpc-wallet@0.77.0'
  - '@seams/wallet-connect@0.77.0'
  - '@seams/sayso-verdict@0.2.0'
  - '@seams/voice-capture@0.72.0'
  - '@seams/voice-verdict@0.72.0'
  - '@seams/voice-sign@0.72.0'
